<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펭귄 데이터 분석 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PENGUINS 데이터 <span>분석 실습</span></h1>
    <p class="lede"><span class="src">Palmer Penguins</span>남극 펭귄 세 종의 측정값을 살펴보며 데이터 분석의 기본 흐름을 익혀 봅니다.<br>각 활동에서 <b>빈칸을 채워 코드를 완성</b>하고 <b>▶ 실행</b>으로 결과를 확인한 뒤, 실행 결과가 말해 주는 정보를 직접 해석해 보세요.</p>
    <ol class="flow" id="flow" aria-label="데이터 처리 흐름"></ol>
  </header>
  <div class="app">
    <nav class="rail" aria-label="학습 단계">
      <ol id="rail"></ol>
      <div class="prog" id="prog"></div>
    </nav>
    <main id="main"></main>
  </div>
  <footer>PENGUINS LAB · 데이터 과학 학습용 인터랙티브 워크시트</footer>
</div>
<div id="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
